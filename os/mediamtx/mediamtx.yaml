# https://github.com/bluenviron/mediamtx/blob/v1.18.2/mediamtx.yml

# https://mediamtx.org/docs/usage/webrtc-specific-features#solving-webrtc-connectivity-issues
webrtcAdditionalHosts: [
    # current ip address, substituted at startup by lib/mediamtx.js
    192.0.2.1,
    # hotspot address, always reachable by a client on the AP
    192.168.4.1,
  ]

# https://mediamtx.org/docs/usage/decrease-packet-loss
writeQueueSize: 1024

paths:
  # This is published by controller at rtsp://127.0.0.1:8554/cam
  # http://planktoscope-sponge-bob:8889/cam/
  # the controler must be started after mediamtx
  cam:
    # https://github.com/bluenviron/mediamtx/pull/5335
    alwaysAvailable: true
    alwaysAvailableTracks:
      - codec: H264
    # Rewrite this file's placeholder hostname/IP (above) with the device's real
    # values at startup. mediamtx watches the
    # config file and hot-reloads after the rewrite. See lib/mediamtx.js.
    runOnInit: /usr/bin/node /opt/PlanktoScope/lib/mediamtx.js
