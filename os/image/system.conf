[system]
compatible=rauc-demo-x86
bootloader=custom
mountprefix=/mnt/rauc
bundle-formats=-plain
data-directory=/home/pi/data/rauc

[handlers]
bootloader-custom-backend=/home/pi/data/PlanktoScope/raspberrypi-firmware-rauc-bootloader-backend/bootloader-custom-backend

[keyring]
path=demo.cert.pem

[slot.firmwarefs.0]
device=/dev/nvme0n1p2
type=vfat
bootname=A

[slot.firmwarefs.1]
device=/dev/nvme0n1p3
type=vfat
bootname=B

[slot.rootfs.0]
parent=firmwarefs.0
device=/dev/nvme0n1p4
type=ext4

[slot.rootfs.1]
parent=firmwarefs.1
device=/dev/nvme0n1p5
type=ext4
